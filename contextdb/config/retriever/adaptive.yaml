# Adaptive Depth-Jumping Retriever Configuration
# This retriever dynamically merges multiple depths into single LLM calls
# to reduce total API calls while maintaining search quality.

# Token budget per LLM call
max_tokens_per_call: 16000

# Fill threshold: stop accumulating depths when this fraction of budget is reached
# Lower = more aggressive merging, higher = more conservative
fill_threshold: 0.7

# Application-level cache settings
cache_enabled: true
cache_max_entries: 1000
cache_ttl_seconds: 3600
cache_max_memory_mb: 100

# Beam-guided pruning: filter nodes by parent-child relationship
enable_beam_pruning: true

# Hybrid caching strategy:
# - Depths <= max_pregenerated_depth: Use pre-generated content (stable cache keys)
# - Depths > max_pregenerated_depth: Use filtered content (cheaper, no wasted cache_read)
# Set to -1 to disable pregeneration entirely (always use filtered content)
# Set to high value (e.g., 100) to always use pregeneration (original behavior)
max_pregenerated_depth: 1
